# Perfil cloud (D17, fase 2): notebook en Colab + AstraDB.
#   cp config/pipeline.cloud.example.yaml config/pipeline.cloud.yaml   (en .gitignore)
# y definir la variable de entorno ASTRA_DB_TOKEN antes de correr. El token nunca va en este archivo.

# El lake queda en data/datalake/ del repo clonado (disco de la sesión de Colab): ahí viene Landing,
# que está versionado. Se pierde al reciclarse la sesión; alternativa en Drive: pisar datalake.root.

serving:
  provider: "astradb"
  astradb:
    # Colab: subir el .zip a /content. Docker: docker-compose.yml define ASTRA_BUNDLE_PATH.
    secure_connect_bundle: "${ASTRA_BUNDLE_PATH:-/content/secure-connect-cloud-analytics.zip}"
