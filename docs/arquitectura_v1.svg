<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="600" viewBox="0 0 1420 600" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#647382"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="aq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b02a2a"/>
    </marker>
  </defs>

  <rect width="1420" height="600" fill="#ffffff"/>

  <!-- ENCABEZADO -->
  <text x="40" y="42" font-size="20" font-weight="700" fill="#1f2933">Cloud Provider Analytics · Arquitectura v1</text>
  <text x="40" y="63" font-size="12.5" fill="#647382">Patrón Lambda · PySpark + Structured Streaming + Parquet + Cassandra/AstraDB</text>
  <text x="1380" y="42" font-size="12.5" fill="#8a94a0" text-anchor="end">ITBA · Big Data 2C 2026</text>
  <text x="1380" y="63" font-size="12.5" fill="#8a94a0" text-anchor="end">Primera entrega · 05/10/2026</text>

  <!-- ETIQUETAS DE COLUMNA -->
  <g font-size="10" font-weight="600" fill="#9aa4b0" letter-spacing="1.3">
    <text x="40"   y="104">FUENTES</text>
    <text x="232"  y="104">INGESTA</text>
    <text x="444"  y="104">BRONZE</text>
    <text x="636"  y="104">SILVER</text>
    <text x="848"  y="104">GOLD</text>
    <text x="1050" y="104">SERVING</text>
    <text x="1242" y="104">CONSUMO</text>
  </g>

  <!-- ===== FUENTES / LANDING ===== -->
  <rect x="40" y="118" width="166" height="250" rx="7" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="54" y="141" font-size="13.5" font-weight="700" fill="#3f4854">Landing</text>
  <text x="54" y="157" font-size="10" fill="#8a94a0">raw · inmutable</text>
  <line x1="54" y1="170" x2="192" y2="170" stroke="#dde2e6"/>
  <text x="54" y="191" font-size="11" font-weight="600" fill="#495057">7 CSV maestros</text>
  <g font-size="10" fill="#6c757d">
    <text x="54" y="209">clientes · usuarios</text>
    <text x="54" y="225">recursos · tickets</text>
    <text x="54" y="241">marketing · NPS</text>
    <text x="54" y="257">facturación mensual</text>
  </g>
  <text x="54" y="274" font-size="9.5" fill="#9aa4b0">4.112 filas</text>
  <line x1="54" y1="288" x2="192" y2="288" stroke="#dde2e6"/>
  <text x="54" y="309" font-size="11" font-weight="600" fill="#495057">Eventos de uso</text>
  <g font-size="10" fill="#6c757d">
    <text x="54" y="327">usage_events_stream</text>
    <text x="54" y="343">120 archivos JSONL</text>
  </g>
  <text x="54" y="359" font-size="9.5" fill="#9aa4b0">43.200 eventos · 60 días</text>

  <!-- ===== INGESTA ===== -->
  <rect x="232" y="118" width="186" height="118" rx="7" fill="#eefaf7" stroke="#0f766e"/>
  <text x="246" y="141" font-size="12.5" font-weight="700" fill="#0f766e">Batch · PySpark</text>
  <text x="246" y="157" font-size="10" fill="#5b8f88">capa batch · maestros</text>
  <line x1="246" y1="170" x2="404" y2="170" stroke="#cfe6e1"/>
  <g font-size="10.5" fill="#33564f">
    <text x="246" y="191">lectura con esquema explícito</text>
    <text x="246" y="208">deduplicación por clave</text>
    <text x="246" y="225">columnas técnicas de ingesta</text>
  </g>

  <rect x="232" y="252" width="186" height="116" rx="7" fill="#eef3fd" stroke="#1d4ed8"/>
  <text x="246" y="275" font-size="12.5" font-weight="700" fill="#1d4ed8">Structured Streaming</text>
  <text x="246" y="291" font-size="10" fill="#6b83b8">capa speed · eventos</text>
  <line x1="246" y1="304" x2="404" y2="304" stroke="#d3dff7"/>
  <g font-size="10.5" fill="#2b3f66">
    <text x="246" y="325">micro-lotes con watermark</text>
    <text x="246" y="342">deduplicación por event_id</text>
    <text x="246" y="359">checkpointing</text>
  </g>

  <!-- ===== BRONZE ===== -->
  <rect x="444" y="118" width="166" height="250" rx="7" fill="#fdf4e7" stroke="#c8893d"/>
  <text x="458" y="141" font-size="13.5" font-weight="700" fill="#9a5b1f">Bronze</text>
  <text x="458" y="157" font-size="10" fill="#b58a5c">raw estándar · Parquet</text>
  <line x1="458" y1="170" x2="596" y2="170" stroke="#eddcc4"/>
  <g font-size="10.5" fill="#6d4518">
    <text x="458" y="191">mismo grano que la fuente</text>
    <text x="458" y="211">tipificación explícita</text>
    <text x="458" y="231">esquema único para las</text>
    <text x="458" y="246">dos versiones del evento</text>
    <text x="458" y="266">ingest_ts · source_file</text>
  </g>
  <line x1="458" y1="284" x2="596" y2="284" stroke="#eddcc4"/>
  <text x="458" y="305" font-size="10.5" font-weight="600" fill="#9a5b1f">Particionado por fecha</text>
  <text x="458" y="324" font-size="10" fill="#6d4518">event_date=YYYY-MM-DD</text>
  <text x="458" y="345" font-size="9.5" fill="#b58a5c">60 particiones diarias</text>
  <text x="458" y="359" font-size="9.5" fill="#b58a5c">maestros sin particionar</text>

  <!-- ===== SILVER ===== -->
  <rect x="636" y="118" width="186" height="250" rx="7" fill="#f1f4f8" stroke="#94a3b8"/>
  <text x="650" y="141" font-size="13.5" font-weight="700" fill="#475569">Silver</text>
  <text x="650" y="157" font-size="10" fill="#8d9bad">conformado · Parquet</text>
  <line x1="650" y1="170" x2="808" y2="170" stroke="#dde3ea"/>
  <g font-size="10.5" fill="#3d4b5c">
    <text x="650" y="191">casteo con fallback</text>
    <text x="650" y="211">normalización de dominios</text>
    <text x="650" y="231">joins con dimensiones</text>
    <text x="650" y="251">nulos y outliers</text>
    <text x="650" y="271">reglas de calidad</text>
  </g>
  <line x1="650" y1="288" x2="808" y2="288" stroke="#dde3ea"/>
  <text x="650" y="309" font-size="10.5" font-weight="600" fill="#475569">Métricas derivadas</text>
  <g font-size="10" fill="#3d4b5c">
    <text x="650" y="328">daily_cost_usd · requests</text>
    <text x="650" y="345">cpu_hours · storage_gb_hours</text>
  </g>

  <!-- ===== QUARANTINE ===== -->
  <rect x="636" y="420" width="186" height="74" rx="7" fill="#fdf0f0" stroke="#e88b8b"/>
  <text x="650" y="442" font-size="12" font-weight="700" fill="#b02a2a">Quarantine</text>
  <g font-size="10" fill="#8a3232">
    <text x="650" y="461">registros rechazados, con</text>
    <text x="650" y="477">la regla que los rechazó</text>
  </g>

  <!-- ===== GOLD ===== -->
  <rect x="848" y="118" width="176" height="250" rx="7" fill="#fdf6dd" stroke="#d4a017"/>
  <text x="862" y="141" font-size="13.5" font-weight="700" fill="#8a6d0b">Gold</text>
  <text x="862" y="157" font-size="10" fill="#b39a48">marts de negocio · Parquet</text>
  <line x1="862" y1="170" x2="1010" y2="170" stroke="#eee1b6"/>
  <text x="862" y="191" font-size="10" font-weight="600" fill="#8a6d0b" letter-spacing="0.5">FINOPS</text>
  <g font-size="10" fill="#6b5408">
    <text x="862" y="210">org_daily_usage_by_service</text>
    <text x="862" y="227">revenue_by_org_month</text>
    <text x="862" y="244">cost_anomaly_mart</text>
  </g>
  <text x="862" y="270" font-size="10" font-weight="600" fill="#8a6d0b" letter-spacing="0.5">SOPORTE</text>
  <text x="862" y="289" font-size="10" fill="#6b5408">tickets_by_org_date</text>
  <line x1="862" y1="306" x2="1010" y2="306" stroke="#eee1b6"/>
  <g font-size="9.5" fill="#b39a48">
    <text x="862" y="326">grano diario por organización</text>
    <text x="862" y="342">anomalías de costo</text>
    <text x="862" y="358">11.050 filas en el mart diario</text>
  </g>

  <!-- ===== SERVING ===== -->
  <rect x="1050" y="118" width="166" height="250" rx="7" fill="#f5f0fc" stroke="#a78bfa"/>
  <text x="1064" y="141" font-size="13.5" font-weight="700" fill="#6d28d9">Cassandra</text>
  <text x="1064" y="157" font-size="10" fill="#9a86c4">AstraDB · cloud_analytics</text>
  <line x1="1064" y1="170" x2="1202" y2="170" stroke="#e3d9f6"/>
  <text x="1064" y="191" font-size="10.5" font-weight="600" fill="#6d28d9">Modelo query-first</text>
  <g font-size="10" fill="#4c2b8f">
    <text x="1064" y="211">una tabla por cada</text>
    <text x="1064" y="227">consulta del negocio</text>
  </g>
  <line x1="1064" y1="246" x2="1202" y2="246" stroke="#e3d9f6"/>
  <g font-size="10" fill="#4c2b8f">
    <text x="1064" y="267">partition key: org_id</text>
    <text x="1064" y="284">clustering: fecha DESC</text>
    <text x="1064" y="301">carga desde Spark</text>
    <text x="1064" y="318">upsert idempotente</text>
  </g>
  <text x="1064" y="345" font-size="9.5" fill="#9a86c4">particiones de ~138 filas</text>

  <!-- ===== CONSUMO ===== -->
  <rect x="1242" y="118" width="138" height="250" rx="7" fill="#eefcf4" stroke="#34d399"/>
  <text x="1256" y="141" font-size="13.5" font-weight="700" fill="#047857">Consumo</text>
  <text x="1256" y="157" font-size="10" fill="#5fae8c">analítica</text>
  <line x1="1256" y1="170" x2="1366" y2="170" stroke="#cdeedd"/>
  <g font-size="11" fill="#0a5c42">
    <text x="1256" y="193">FinOps</text>
    <text x="1256" y="214">Soporte</text>
    <text x="1256" y="235">Producto</text>
  </g>
  <line x1="1256" y1="253" x2="1366" y2="253" stroke="#cdeedd"/>
  <g font-size="10" fill="#0a5c42">
    <text x="1256" y="274">consultas CQL</text>
    <text x="1256" y="291">sobre los marts</text>
  </g>
  <text x="1256" y="318" font-size="10" fill="#0a5c42">notebook · BI</text>

  <!-- ===== FLECHAS ===== -->
  <g stroke-width="1.6" fill="none">
    <path d="M206,177 L228,177" stroke="#0f766e" marker-end="url(#ab)"/>
    <path d="M206,310 L228,310" stroke="#1d4ed8" marker-end="url(#as)"/>
    <path d="M418,177 L440,177" stroke="#0f766e" marker-end="url(#ab)"/>
    <path d="M418,310 L440,310" stroke="#1d4ed8" marker-end="url(#as)"/>
    <path d="M610,243 L632,243" stroke="#647382" marker-end="url(#a)"/>
    <path d="M822,243 L844,243" stroke="#647382" marker-end="url(#a)"/>
    <path d="M1024,243 L1046,243" stroke="#647382" marker-end="url(#a)"/>
    <path d="M1216,243 L1238,243" stroke="#647382" marker-end="url(#a)"/>
    <path d="M729,368 L729,416" stroke="#b02a2a" stroke-dasharray="5 3" marker-end="url(#aq)"/>
  </g>
  <text x="740" y="396" font-size="10" fill="#b02a2a">rechazos</text>

  <!-- ===== CAPACIDADES TRANSVERSALES ===== -->
  <rect x="40" y="516" width="1340" height="62" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="58" y="539" font-size="10.5" font-weight="700" fill="#475569" letter-spacing="0.9">CAPACIDADES TRANSVERSALES</text>
  <g font-size="11" fill="#3d4b5c">
    <text x="58"   y="562">Gobierno</text>
    <text x="180"  y="562">Calidad</text>
    <text x="290"  y="562">Metadatos</text>
    <text x="420"  y="562">Linaje</text>
    <text x="530"  y="562">Seguridad y accesos</text>
    <text x="720"  y="562">Observabilidad</text>
    <text x="880"  y="562">Idempotencia</text>
    <text x="1030" y="562">Reproducibilidad</text>
    <text x="1210" y="562">Versionado</text>
  </g>
</svg>
